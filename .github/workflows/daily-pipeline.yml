name: Daily Pipeline

on:
  schedule:
    # Run at 8 AM UTC (3 AM EST / 12 AM PST) every day
    - cron: "0 8 * * *"
  workflow_dispatch: # Allow manual triggers

# Never run two at once: a manual dispatch overlapping the cron run could
# otherwise double-send drip emails or race on the same snapshot rows.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # only used by the keep-alive step below

jobs:
  daily-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # tools/run_daily.py exits non-zero when prices/coverage/analytics/signals/drip
      # had problems, so this step (and the run) goes red and GitHub notifies you.
      - name: Run daily pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DRIP_SENDER_EMAIL: ${{ secrets.DRIP_SENDER_EMAIL }}
          WHOLESALE_URL: ${{ secrets.WHOLESALE_URL }}
        run: python tools/run_daily.py

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-run-log-${{ github.run_number }}
          path: .tmp/daily_run_log.json
          retention-days: 30

      # GitHub disables scheduled workflows in public repos after 60 days without
      # repository activity (this one was disabled that way in 2026-07). Re-enabling
      # the workflow on every run is the documented workaround; if the schedule still
      # stops, a commit to the repo also resets the timer.
      - name: Keep scheduled runs alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable daily-pipeline.yml --repo "$GITHUB_REPOSITORY"
